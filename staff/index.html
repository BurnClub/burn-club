<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Burn Club Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="phone-frame">
  <div class="app" id="app">

    <!-- ============ LOGIN SCREEN ============ -->
    <section class="screen visible" id="screen-login" data-screen>
      <div class="login-wrap">
        <img class="login-logo" src="../assets/burn-club-logo.png" alt="Burn Club" />
        <h1 class="login-title">BURN CLUB <span>STAFF</span></h1>
        <p class="login-sub">Messages · Workouts · Live</p>

        <form class="login-form" id="login-form">
          <label class="field">
            <span>Email</span>
            <input type="email" placeholder="staff@burnclub.com" />
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" placeholder="••••••••" />
          </label>
          <button type="submit" class="btn-primary">Log In</button>
        </form>
      </div>
    </section>

    <!-- ============ MAIN APP (tabs) ============ -->
    <div class="main-app" id="main-app">

      <!-- ---------- MESSAGES ---------- -->
      <section class="screen tab-screen" id="tab-messages" data-tab>
        <header class="topbar">
          <div>
            <p class="eyebrow">Staff</p>
            <h1 class="topbar-title">Messages</h1>
          </div>
        </header>
        <div class="conversation-list" id="conversation-list"></div>
      </section>

      <!-- ---------- MESSAGE THREAD ---------- -->
      <section class="screen thread-screen" id="screen-thread" data-screen>
        <header class="detail-header">
          <button class="back-btn" id="thread-back-btn">←</button>
          <span class="detail-tag" id="thread-title">Conversation</span>
        </header>
        <div class="thread-messages" id="thread-messages"></div>
        <form class="thread-composer" id="thread-composer">
          <input type="text" id="thread-input" class="thread-input" placeholder="Reply as staff…" autocomplete="off" />
          <button type="submit" class="thread-send-btn">➤</button>
        </form>
      </section>

      <!-- ---------- CIRCUITS (quick-edit) ---------- -->
      <section class="screen tab-screen" id="tab-circuits" data-tab>
        <header class="topbar">
          <div>
            <p class="eyebrow">Quick edit</p>
            <h1 class="topbar-title">Workouts</h1>
          </div>
        </header>
        <div class="circuit-list-compact" id="staff-circuit-list"></div>
      </section>

      <!-- ---------- CIRCUIT QUICK-EDIT ---------- -->
      <section class="screen" id="screen-circuit-edit" data-screen>
        <header class="detail-header">
          <button class="back-btn" id="circuit-edit-back-btn">←</button>
          <span class="detail-tag" id="circuit-edit-title">Workout</span>
        </header>
        <div class="circuit-edit-blocks" id="circuit-edit-blocks"></div>
        <button class="btn-primary sticky-cta" id="circuit-edit-save-btn">Save Changes</button>
      </section>

      <!-- ---------- LIVE ---------- -->
      <section class="screen tab-screen" id="tab-live" data-tab>
        <header class="topbar">
          <div>
            <p class="eyebrow">Broadcast</p>
            <h1 class="topbar-title">Go Live</h1>
          </div>
        </header>

        <div id="live-offline-view">
          <div class="live-offline-card">
            <p class="live-offline-icon">🎥</p>
            <p class="live-offline-text">You're not live. Starting a broadcast lets members join instantly and chat with you in real time.</p>
            <label class="modal-field">Session title
              <input type="text" id="live-title-input" value="Live Q&amp;A with Coach Chris" />
            </label>
            <button class="btn-primary" id="go-live-btn">🔴 Go Live</button>
          </div>
        </div>

        <div id="live-online-view" style="display:none;">
          <div class="live-video staff-live-video">
            <p class="live-video-label" id="staff-live-title">Live Q&amp;A with Coach Chris</p>
            <div class="live-viewer-count"><span id="live-viewer-num">0</span> watching</div>
          </div>
          <h2 class="section-title">Live Chat</h2>
          <div class="live-chat-messages staff-live-chat" id="staff-live-chat"></div>
          <button class="btn-primary danger sticky-cta" id="end-live-btn">End Live</button>
        </div>
      </section>

      <!-- ---------- BOTTOM NAV ---------- -->
      <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-btn active" data-tab-target="tab-messages">
          <span class="nav-icon">💬</span><span>Messages</span><span class="msg-unread-badge" data-role="msg-unread-badge"></span>
        </button>
        <button class="nav-btn" data-tab-target="tab-circuits">
          <span class="nav-icon">🏋️</span><span>Workouts</span>
        </button>
        <button class="nav-btn" data-tab-target="tab-live">
          <span class="nav-icon">🔴</span><span>Live</span>
        </button>
      </nav>

    </div><!-- /main-app -->

  </div><!-- /app -->
</div><!-- /phone-frame -->

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
